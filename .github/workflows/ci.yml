name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Ensure PostgreSQL server binaries are available for RLS tests
        run: |
          if ! command -v initdb >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql
          fi
          PG_BIN=$(dirname $(find /usr/lib/postgresql -name initdb | head -n 1))
          echo "$PG_BIN" >> $GITHUB_PATH

      - name: Run database migration & multi-mentee RLS isolation tests
        run: npm run test:db
